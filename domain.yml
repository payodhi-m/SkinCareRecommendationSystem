version: '3.1'
intents:
- affirm
- ask_location
- bot_challenge
- deny
- enquire
- goodbye
- greet
- inform
- mood_great
- mood_unhappy
- product_recommendation
entities:
- category
- skin_type
slots:
  category:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: category
  skin_type:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: skin_type
  requested_slot:
    type: text
    influence_conversation: false
    mappings:
    - type: from_entity
      entity: requested_slot
responses:
  utter_greet:
  - text: Hey! How are you?
  utter_cheer_up:
  - text: 'Here is something to cheer you up:'
    image: https://i.imgur.com/nGF1K8f.jpg
  utter_did_that_help:
  - text: Did that help you?
  utter_happy:
  - text: Great, carry on!
  utter_goodbye:
  - text: Bye
  utter_iamabot:
  - text: I am a bot, powered by Rasa.
  utter_ask_location:
  - text: Can you tell me your location
  utter_ask_product:
  - text: What product are you looking for? (moisturizer, cleanser, sunscreen, face mask, eye cream)
  utter_ask_for_category:
  - text: What product category are you interested in? (moisturizer, cleanser, sunscreen, face mask, eye cream)
  utter_no_category_found:
  - text: Sorry, I couldn't find any product based on the category

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true

actions:
- action_recommend_products
- utter_no_category_found
- utter_greet
- utter_goodbye
- action_recommend_products_based_on_skintype

synonyms:
  moisturizer:
    - lotion
    - cream
    - face cream
    - moisturizer
    - hydrator
  
  sun protect:
    - sun block
    - sun protect
    - sunscreen
    - sun screen
    - spf
    - sunprotect

  shampoo:
    - hair wash
    - hair cleanser
    - shampoo
  
  cleanser:
    - face wash
    - cleanser
    - facewash
  
  cateogory:
    - moisturizer
    - face cream
    - sun protect
    - sunscreeen
    - toner
    - cleanser
    - eye cream
    - serum
    - shampoo

