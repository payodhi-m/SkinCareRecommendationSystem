    - how can you help me?
    - what is your functionality?

- intent: product_recommendation
  examples: |
    - Can you recommend skin care product
    - I need help finding skin care product
    - What products do you have for me?
    - I need a lotion (category) 
    - I am interested in [cleansers](category)
    - I am looking for a [cleanser](category)
    - I am looking for a [sun protect](category)
    - [eye cream](category)
    - I am looking for [moisturizer](category)
    - Any suggestions for a [cream](category) for [oily](skin_type) skin
    - Looking for [cleanser](category) for [dry](skin_type) skin
    - I am looking for [serum](category) for [sensitive](skin_type) skin
    - Suggest some good [toner](category) for [normal](skin_type)
  

- intent: inform
  examples: |
    - moisturizer(category)
    - I am looking for a [moisturizer](category)
    - can you recommend a [cleanser](category)?
    - I want to buy [lotion](category)
    - show me some [cream](category)
    - I need a [sunblock](category)
    - I'm looking for a [sunscreen](category)
    - I want a [serum](category)
    - can you suggest a [sun protect](category)
    - how about a [toner](category)
    - show me some [serums](category)
    - I am looking for a [sun screen](category)
    - I am looking for a [spf](category)
