version: "3.1"

rules:
  - rule: greetings
    steps:
      - intent: greet
      - action: utter_help_response
      
  - rule: activate customer information form
    #conversation_start: true
    steps: 
      - intent: request_skincare
      - action: customer_information_form
      - active_loop: customer_information_form
  
  - rule: save customer information 
    condition:
    - active_loop: customer_information_form
    steps:
      - action: customer_information_form
      - active_loop: null
      - action: action_save_customer_information
      - action: utter_proceed_to_recommendation
      #- action: action_proceed_to_story
    #wait_for_user_input: false

  - rule: activate product recommendation flow
    steps:
      - intent: affirm
      - action: action_get_product_recommendation

